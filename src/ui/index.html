<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Progress HUD</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="hud">
      <header>
        <span class="dot" aria-hidden="true"></span>
        <span id="status">连接中</span>
        <button id="hide-window" type="button" aria-label="隐藏 HUD" title="隐藏窗口，不停止任务">×</button>
      </header>
      <div id="compatibility" class="banner" role="status"></div>
      <div id="tasks" aria-label="任务列表"></div>
      <p id="empty">等待伴侣程序连接</p>
    </main>
    <script type="module" src="/renderer.js"></script>
  </body>
</html>
