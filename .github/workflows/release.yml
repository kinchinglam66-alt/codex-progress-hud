name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Prepare canonical test temp directory
        shell: pwsh
        run: |
          $testTemp = node -p "require('node:fs').realpathSync(require('node:os').tmpdir())"
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content -Raw package.json | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME does not match $expected" }
      - run: npm run verify:release
      - run: npm run release:artifacts
      - run: npm run smoke:packaged
      - run: npm run diagnose:mcp:packaged
      - name: Resolve artifact names
        id: artifacts
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "installer=release/Codex-Progress-HUD-Setup-$version.exe" >> $env:GITHUB_OUTPUT
          "plugin=release/codex-progress-hud-plugin-$version.zip" >> $env:GITHUB_OUTPUT
      - name: Verify checksums
        shell: pwsh
        run: Get-Content release/SHA256SUMS.txt | ForEach-Object { $hash, $file = $_ -split '  ', 2; if ((Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw "Checksum mismatch: $file" } }
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.plugin }}
            release/SHA256SUMS.txt
