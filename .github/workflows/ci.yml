name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Prepare canonical test temp directory
        shell: pwsh
        run: |
          $testTemp = node -p "require('node:fs').realpathSync(require('node:os').tmpdir())"
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TMPDIR=$testTemp" >> $env:GITHUB_ENV
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npm test -- --run --maxWorkers=1 --no-file-parallelism
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --run --maxWorkers=1 --no-file-parallelism
      - run: npm run validate:plugin
      - if: runner.os == 'Windows'
        run: npm run build:launcher:release
      - if: runner.os == 'Windows'
        run: npm run pack:win
      - if: runner.os == 'Windows'
        run: npm run smoke:packaged
      - if: runner.os == 'Windows'
        run: npm run diagnose:mcp:packaged
