name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - name: Prepare canonical test temp directory
        shell: pwsh
        run: |
          if ($IsWindows) {
            # The hosted runner's profile uses RUNNER~1, which Node may expand
            # differently on a second realpath call. Use a stable root path.
            $testTemp = Join-Path ([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)) 'hud-ci-temp'
            New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          } else {
            $testTemp = node -p "require('node:fs').realpathSync(require('node:os').tmpdir())"
          }
          $canonical = node -p "require('node:fs').realpathSync(process.argv[1])" $testTemp
          if ([System.IO.Path]::GetFullPath($canonical) -ne [System.IO.Path]::GetFullPath($testTemp)) {
            throw "Test temp directory is not canonical: $testTemp -> $canonical"
          }
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TMPDIR=$testTemp" >> $env:GITHUB_ENV
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Windows native security boundary first
        if: runner.os == 'Windows'
        run: npm test -- --run tests/estimation/native-powershell-environment.test.ts tests/estimation/observer-home.test.ts tests/estimation/identity-reusable-home.test.ts tests/estimation/native-guard.test.ts tests/estimation/native-guard-launch.test.ts --maxWorkers=1 --no-file-parallelism
      - if: runner.os == 'Windows'
        run: npm test -- --run --maxWorkers=1 --no-file-parallelism
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --run --maxWorkers=1 --no-file-parallelism
      - run: npm run validate:plugin
      - if: runner.os == 'Windows'
        run: npm run build:launcher:release
      - if: runner.os == 'Windows'
        run: npm run pack:win
      - if: runner.os == 'Windows'
        run: npm run smoke:packaged
      - if: runner.os == 'Windows'
        run: npm run diagnose:mcp:packaged
