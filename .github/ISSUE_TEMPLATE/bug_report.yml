name: Bug report
description: Report reproducible behavior without including private task data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste prompts, source code, credentials, bearer tokens, or private command output.
  - type: input
    id: version
    attributes:
      label: HUD version
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex version and surface
      description: For example, CLI or desktop app and its version.
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic task names and redact sensitive paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: mcp-diagnostic
    attributes:
      label: MCP diagnostic result
      description: Run npm run diagnose:mcp and paste only the redacted summary. Do not include tokens or private paths.
  - type: input
    id: activated-cache-version
    attributes:
      label: Activated plugin cache version
      description: Record the version segment from the skill path shown in the affected task, without including private task data.
