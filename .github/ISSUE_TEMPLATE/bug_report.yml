name: Bug report
description: Report reproducible behavior without including private task data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste prompts, source code, credentials, bearer tokens, or private command output.
  - type: input
    id: version
    attributes:
      label: Plugin, companion, and protocol versions
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex version and surface
      description: For example, CLI or desktop app and its version.
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic task names and redact sensitive paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Structured error code
      description: Include only the bounded code shown by the HUD or launcher.
  - type: textarea
    id: lifecycle-state
    attributes:
      label: Desired and observed states
      description: Include installation, Hook activity, MCP lease, companion, compatibility, and tracking categories without task content.
  - type: textarea
    id: mcp-diagnostic
    attributes:
      label: MCP diagnostic result
      description: Attach only the sanitized report after reviewing it. Never include tokens, prompts, source files, raw identifiers, private paths, or unredacted logs.
  - type: input
    id: activated-cache-version
    attributes:
      label: Activated plugin cache version
      description: Record the version segment from the skill path shown in the affected task, without including private task data.
