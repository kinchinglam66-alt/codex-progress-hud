appId: io.github.kinchinglam66alt.codex-progress-hud
productName: Codex Progress HUD
asar: true
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - LICENSE
  - NOTICE
extraResources:
  - from: src/estimation/assets/observer-instructions.md
    to: observer-assets/observer-instructions.md
  - from: src/estimation/assets/observer.schema.json
    to: observer-assets/observer.schema.json
  - from: src/estimation/assets/context-summary-instructions.md
    to: observer-assets/context-summary-instructions.md
  - from: src/estimation/assets/context-summary.schema.json
    to: observer-assets/context-summary.schema.json
  - from: scripts/windows/observer-home.ps1
    to: observer-home.ps1
  - from: build/stop-companion.ps1
    to: stop-companion.ps1
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Codex-Progress-HUD-Setup-${version}.${ext}
nsis:
  perMachine: false
  oneClick: false
  allowElevation: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  runAfterFinish: false
  include: build/installer.nsh
